server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml;

    # Fingerprinted build output: safe to cache forever. `^~` wins over the regex
    # locations below, so hashed fonts/images keep the immutable policy.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Entry points that must be revalidated, or new deploys (and service worker updates) never reach users.
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    location ~* ^/(index\.html|sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Audio samples: not every mime.types ships these, and nosniff needs the right type.
    location ~* \.(?:wav|ogg)$ {
        include /etc/nginx/snippets/security-headers.conf;
        types {
            audio/wav wav;
            audio/ogg ogg;
        }
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    # Non-fingerprinted static media (images, icons): cache, but revalidate weekly.
    location ~* \.(?:png|webp|svg|ico|woff2)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
