# pnpm 11 bloquea los scripts de instalación (postinstall, etc.) de las dependencias
# salvo que estén listadas acá. Hoy ninguna dependencia del árbol los necesita
# (el lockfile no tiene ningún paquete con `requiresBuild`): Vite 8 usa Rolldown/Oxc
# con binarios prebuilt por plataforma y los navegadores de Playwright se bajan con
# `playwright install`, no con un postinstall. Si una dependencia futura lo pide,
# agregarla de forma explícita (`pnpm approve-builds`) y documentar por qué.
# `minimumReleaseAge` queda en el valor por defecto de pnpm 11 (1440 min = 24 h).
allowBuilds: {}
