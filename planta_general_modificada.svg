<text x="23.0" y="7.3" class="small" text-anchor="start">Living-comedor-cocina: 9.60 x 4.20 -> 8.40 x 4.20</text>
<text x="23.0" y="8.0" class="small" text-anchor="start">   (-1.20 m de largo; se corre toilette y lavadero)</text>
<text x="23.0" y="8.7" class="small" text-anchor="start">Oficina/sala de música: 2.90 x 6.00 -> 4.20 x 3.60</text>
<text x="23.0" y="9.399999999999999" class="small" text-anchor="start">   (ventana de cochera reubicada a muro oeste)</text>
<text x="23.0" y="10.1" class="small" text-anchor="start">Cochera: 5.82 x 6.00 -> 5.40 x 5.40 (solo techo)</text>
<text x="23.0" y="10.8" class="small" text-anchor="start">Galería de parrilla: 5.40 -> 3.60 de largo</text>
<text x="23.0" y="11.5" class="small" text-anchor="start">   (se mantiene pegada al living)</text>
<text x="23.0" y="12.8" class="lbl" text-anchor="start">CÁLCULO DE PLACAS (DURLOCK 1,20 m)</text>
<text x="23.0" y="14.2" class="small" text-anchor="start">8.40 m = 7 placas exactas (sin desperdicio)</text>
<text x="23.0" y="14.899999999999999" class="small" text-anchor="start">3.60 m = 3 placas exactas</text>
<text x="23.0" y="15.6" class="small" text-anchor="start">4.20 m = 3 placas + 0,60 m (sobra de 0,60)</text>
<text x="23.0" y="16.299999999999997" class="small" text-anchor="start">5.40 m = 4,5 placas: usar la mitad como cierre</text>
<text x="23.0" y="17.0" class="small" text-anchor="start">Perfiles cada 0,60 m: 4.20, 8.40, 3.60 y 5.40 cierran</text>
<text x="23.0" y="18.2" class="lbl" text-anchor="start">SUPERFICIES (aprox.)</text>
<text x="23.0" y="19.6" class="small" text-anchor="start">Living: 40.32 -> 35.28 m2 (-5.04)</text>
<text x="23.0" y="20.3" class="small" text-anchor="start">Oficina: 17.40 -> 15.12 m2 (-2.28)</text>
<text x="23.0" y="21.0" class="small" text-anchor="start">Cochera: 34.92 -> 29.16 m2 (-5.76)</text>
<text x="23.0" y="21.700000000000003" class="small" text-anchor="start">Galería: -1.80 m de largo (~ -7.9 m2 si prof. 4.40)</text>
