version: 2
updates:
  # Keeps pinned actions and reusable workflows (by SHA) up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Bumps the base-image digests pinned in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # El ecosistema `npm` de Dependabot también actualiza proyectos con pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
