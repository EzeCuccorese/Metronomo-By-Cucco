name: Gemini PR Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel stale incremental runs on new pushes; keep labeled/open runs intact.
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

# A reusable workflow can't get more token permissions than its caller grants:
# without this block the nested job (which needs pull-requests: write to post
# the review) fails at startup when the repository default token is read-only.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Automatic on PR open/reopen/ready/synchronize (never for drafts); on demand with the
    # `gemini-review` label, even on drafts.
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'gemini-review') ||
      (github.event.action != 'labeled' && github.event.pull_request.draft == false)
    # Pinned to a commit: this job gets pull-requests: write and the Gemini key, so a
    # push to the upstream main branch must not change what runs here. Bump both SHAs
    # together on purpose (Dependabot only proposes it when tags are published).
    uses: EzeCuccorese/ia-spec-ops-engine/.github/workflows/reusable-gemini-review.yml@fc66590866e9321d1e490a3e3b17e72be4976ccb # v4.1.0
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    with:
      language: "Spanish"
      exclude: "*.lock,package-lock.json,dist/*,build/*,public/audio/*"
      standards: "SOLID, Clean Code, Resource Safety, Web Audio Timing Accuracy, React Performance"
      model: "gemini-flash-latest"
      # The reusable workflow downloads its review script separately: pin that too.
      engine-ref: "fc66590866e9321d1e490a3e3b17e72be4976ccb"

  clear-label:
    needs: review
    if: always() && github.event.action == 'labeled' && github.event.label.name == 'gemini-review'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove the trigger label so it can be added again
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # The label may already be gone (removed by hand while the review ran).
        run: gh pr edit "${{ github.event.pull_request.number }}" --remove-label gemini-review || true