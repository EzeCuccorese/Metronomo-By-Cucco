name: Deploy (Cloudflare)

# Manual only: the app runs locally for now; nothing is deployed automatically.
# Run it by hand from the Actions tab. It needs the secret CLOUDFLARE_API_TOKEN and the variable
# CLOUDFLARE_ACCOUNT_ID; see "Deploy en Cloudflare" in the README.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare configuration
        id: cloudflare
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Cloudflare deploy skipped::Add the secret CLOUDFLARE_API_TOKEN and the variable CLOUDFLARE_ACCOUNT_ID to enable it."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cloudflare.outputs.enabled == 'true'
        uses: actions/checkout@v7
      - if: steps.cloudflare.outputs.enabled == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (lee la versión de `packageManager`)
      - if: steps.cloudflare.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - if: steps.cloudflare.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.cloudflare.outputs.enabled == 'true'
        run: pnpm build
      - if: steps.cloudflare.outputs.enabled == 'true'
        run: pnpm exec wrangler deploy
